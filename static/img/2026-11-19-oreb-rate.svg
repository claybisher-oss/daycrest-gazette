<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="300" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">Offensive rebounding rate</text>
  <text x="300" y="66" text-anchor="middle" font-size="16" fill="#444">Of every 10 missed shots, how many does the shooting team get back?</text>
  <text x="20" y="128" font-size="17" font-weight="bold" fill="#1a1a1a">Typical</text>
  <g fill="#0033a0"><circle cx="150" cy="122" r="16"/><circle cx="195" cy="122" r="16"/><circle cx="240" cy="122" r="16"/></g>
  <g fill="none" stroke="#999" stroke-width="3"><circle cx="285" cy="122" r="16"/><circle cx="330" cy="122" r="16"/><circle cx="375" cy="122" r="16"/><circle cx="420" cy="122" r="16"/><circle cx="465" cy="122" r="16"/><circle cx="510" cy="122" r="16"/><circle cx="555" cy="122" r="16"/></g>
  <text x="20" y="198" font-size="17" font-weight="bold" fill="#1a1a1a">Indiana</text>
  <g fill="#990000"><circle cx="150" cy="192" r="16"/><circle cx="195" cy="192" r="16"/><circle cx="240" cy="192" r="16"/><circle cx="285" cy="192" r="16"/></g>
  <g fill="none" stroke="#999" stroke-width="3"><circle cx="330" cy="192" r="16"/><circle cx="375" cy="192" r="16"/><circle cx="420" cy="192" r="16"/><circle cx="465" cy="192" r="16"/><circle cx="510" cy="192" r="16"/><circle cx="555" cy="192" r="16"/></g>
  <text x="300" y="250" text-anchor="middle" font-size="15" fill="#444">filled = offensive rebound · open = defense secures it</text>
  <text x="300" y="278" text-anchor="middle" font-size="13" fill="#777">Indiana ≈ 42% (Inside the Hall); typical ≈ 30%. Illustration: Daycrest Gazette</text>
</svg>
